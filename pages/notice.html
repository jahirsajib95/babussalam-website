<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নোটিশ — জামিয়া বাবুস সালাম</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .empty-notice {
            display: none;
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<section class="page-header">
    <h2>📢 নোটিশ বোর্ড</h2>
    <p class="breadcrumb"><a href="../index.html">🏠 মূলপাতা</a> / নোটিশ</p>
</section>

<div class="page-content">

    <!-- ফিল্টার ট্যাব -->
    <div class="notice-tabs">
        <button class="notice-tab active" onclick="filterNotice('all', this)">সব নোটিশ</button>
        <button class="notice-tab" onclick="filterNotice('urgent', this)">🔴 জরুরি</button>
        <button class="notice-tab" onclick="filterNotice('exam', this)">🟡 পরীক্ষা</button>
        <button class="notice-tab" onclick="filterNotice('general', this)">🟢 সাধারণ</button>
    </div>

    <!-- নোটিশ তালিকা কন্টেইনার -->
    <div id="noticeContainer">
        <div id="loading-notice" style="text-align:center; padding:30px;">নোটিশ লোড হচ্ছে...</div>
    </div>
    
    <div id="emptyNotice" class="empty-notice">এই ক্যাটাগরিতে কোনো নোটিশ নেই।</div>

</div>

<div id="footer-placeholder"></div>

<script src="../main.js"></script>

<!-- data.json থেকে ডায়নামিক নোটিশ লোড -->
<script>
    function renderNotices(notices) {
        const container = document.getElementById('noticeContainer');
        container.innerHTML = '';

        notices.forEach(n => {
            const badgeText = n.type === 'urgent' ? '🔴 জরুরি' : (n.type === 'exam' ? '🟡 পরীক্ষা' : '🟢 সাধারণ');
            const card = document.createElement('div');
            card.className = `notice-card ${n.type}`;
            card.setAttribute('data-notice-type', n.type);
            card.innerHTML = `
                <span class="notice-badge ${n.type}">${badgeText}</span>
                <h4>${n.title}</h4>
                <p class="notice-date">📅 ${n.date}</p>
                <p class="notice-excerpt">${n.desc}</p>
            `;
            container.appendChild(card);
        });
    }

    function filterNotice(type, btn) {
        document.querySelectorAll('.notice-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');

        const cards = document.querySelectorAll('.notice-card');
        let visibleCount = 0;

        cards.forEach(card => {
            if(type === 'all' || card.getAttribute('data-notice-type') === type) {
                card.style.display = 'block';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        document.getElementById('emptyNotice').style.display = visibleCount === 0 ? 'block' : 'none';
    }

    // data.json লোড
    fetch('../data.json')
        .then(res => res.json())
        .then(data => {
            if(data.notices && data.notices.length > 0) {
                renderNotices(data.notices);
            } else {
                document.getElementById('loading-notice').innerText = 'বর্তমানে কোনো নোটিশ নেই।';
            }
        })
        .catch(() => {
            document.getElementById('loading-notice').innerText = 'নোটিশ লোড করা যায়নি।';
        });
</script>
</body>
</html>
