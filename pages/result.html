<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পরীক্ষার ফলাফল | জামিয়া বাবুস সালাম</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .result-tabs-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 35px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .result-tabs {
            display: inline-flex;
            gap: 10px;
            background: #E9ECEF;
            padding: 6px;
            border-radius: 50px;
            max-width: 100%;
        }
        .tab-btn {
            background: transparent;
            border: none;
            outline: none;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 4px 10px rgba(15, 81, 50, 0.25);
        }
        .result-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .result-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: var(--radius);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
        }
        .result-info { display: flex; align-items: flex-start; gap: 16px; }
        .folder-icon { font-size: 2.2rem; line-height: 1; }
        .result-details h4 { margin: 0 0 6px 0; color: var(--primary); font-size: 1.25rem; }
        .result-meta {
            margin: 0;
            font-size: 0.9rem;
            color: var(--gray);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .empty-message {
            display: none;
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
            font-size: 1.1rem;
        }
        @media (max-width: 768px) {
            .result-tabs-wrapper { justify-content: flex-start; }
            .result-card { flex-direction: column; align-items: flex-start; padding: 16px; }
            .result-card .btn { width: 100%; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="page-header">
        <h2>পরীক্ষার ফলাফল</h2>
        <div class="breadcrumb">
            <a href="../index.html">মূলপাতা</a> / <span>ফলাফল</span>
        </div>
    </section>

    <main class="page-content">
        <div style="text-align: center; max-width: 750px; margin: 0 auto 30px auto;">
            <p>জামিয়া বাবুস সালাম-এর বিভিন্ন পরীক্ষার ফলাফল নিচে দেওয়া হলো। আপনার কাঙ্ক্ষিত পরীক্ষার ট্যাবে ক্লিক করে ফলাফল দেখুন ও ডাউনলোড করুন।</p>
        </div>

        <!-- ফিল্টার ট্যাব -->
        <div class="result-tabs-wrapper">
            <div class="result-tabs">
                <button class="tab-btn active" onclick="filterTab('term1', this)">১. প্রথম সাময়িক</button>
                <button class="tab-btn" onclick="filterTab('term2', this)">২. দ্বিতীয় সাময়িক</button>
                <button class="tab-btn" onclick="filterTab('annual', this)">৩. বার্ষিক পরীক্ষা</button>
                <button class="tab-btn" onclick="filterTab('monthly', this)">৪. মাসিক পরীক্ষা</button>
            </div>
        </div>

        <!-- ফলাফল কন্টেইনার -->
        <div class="result-list" id="resultContainer">
            <div id="loading" style="text-align:center; padding:30px;">ফলাফল লোড হচ্ছে...</div>
            <div id="noResultMsg" class="empty-message">
                <p>⚠️ এই ক্যাটাগরিতে এখনো কোনো ফলাফল প্রকাশিত হয়নি।</p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../main.js"></script>

    <!-- data.json থেকে লোড ও ফিল্টারিং স্ক্রিপ্ট -->
    <script>
        let currentCategory = 'term1';

        function renderResults(results) {
            const container = document.getElementById('resultContainer');
            const noMsg = document.getElementById('noResultMsg');
            container.querySelectorAll('.result-card').forEach(c => c.remove());

            let hasCard = false;

            results.forEach(r => {
                const cardCat = r.category || 'annual';
                const card = document.createElement('div');
                card.className = 'result-card';
                card.setAttribute('data-category', cardCat);
                if (cardCat !== currentCategory) card.style.display = 'none';
                else hasCard = true;

                card.innerHTML = `
                    <div class="result-info">
                        <span class="folder-icon">📁</span>
                        <div class="result-details">
                            <h4>${r.exam}</h4>
                            <div class="result-meta">
                                <span>📅 প্রকাশের সময়: ${r.publishTime || 'নির্দিষ্ট নয়'}</span>
                                <span>🏷️ বিভাগ: ${r.className}</span>
                            </div>
                        </div>
                    </div>
                    <a href="${r.url}" target="_blank" class="btn btn-primary">ফলাফল দেখুন ও ডাউনলোড</a>
                `;
                container.appendChild(card);
            });

            noMsg.style.display = hasCard ? 'none' : 'block';
        }

        function filterTab(category, buttonElement) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            const cards = document.querySelectorAll('.result-card');
            let hasCard = false;
            cards.forEach(card => {
                if(card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                    hasCard = true;
                } else {
                    card.style.display = 'none';
                }
            });
            document.getElementById('noResultMsg').style.display = hasCard ? 'none' : 'block';
        }

        // data.json ফেচ করা (রুট ডিরেক্টরি থেকে)
        fetch('../data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if(data.results) {
                    renderResults(data.results);
                }
            })
            .catch(() => {
                document.getElementById('loading').innerText = 'ফলাফল লোড করা সম্ভব হয়নি।';
            });
    </script>
</body>
</html>
