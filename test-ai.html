<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>AI API টেস্ট পেজ</title>
    <style>
        body { font-family: sans-serif; padding: 30px; line-height: 1.6; }
        .box { max-width: 600px; margin: 0 auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        button { background: #0F5132; color: #fff; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; }
        #output { margin-top: 20px; padding: 15px; border-radius: 5px; background: #f8f9fa; white-space: pre-wrap; font-family: monospace; }
        .success { color: green; border-left: 5px solid green; }
        .error { color: red; border-left: 5px solid red; }
    </style>
</head>
<body>

<div class="box">
    <h2>🤖 বাবুস সালাম AI টেস্ট</h2>
    <p>নিচের বাটনে ক্লিক করে পরীক্ষা করুন:</p>
    
    <button onclick="testGemini()">এপিআই টেস্ট করুন</button>

    <div id="output">এখানে টেস্টের ফলাফল দেখা যাবে...</div>
</div>

<script>
const API_KEY = "AQ.Ab8RN6JL5VpQa_ILLkc5jiS4W6cpMCN3_zf3y4Uk6oIuOg3Qgg";

async function testGemini() {
    const out = document.getElementById("output");
    out.className = "";
    out.innerText = "গুগলে সংযোগ করা হচ্ছে... অপেক্ষা করুন...";

    try {
        // ✅ গুগলের নির্দেশিত সর্বশেষ gemini-3.8-flash মডেল
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${API_KEY}`;

        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: "তুমি কে? এক লাইনে সুন্দর করে উত্তর দাও।" }]
                }]
            })
        });

        const data = await response.json();

        if (!response.ok) {
            out.className = "error";
            out.innerText = "❌ এরর:\n\n" + JSON.stringify(data, null, 2);
        } else {
            out.className = "success";
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
            out.innerText = "✅ আলহামদুলিল্লাহ! সফল হয়েছে!\n\nAI-এর উত্তর:\n" + reply;
        }

    } catch (err) {
        out.className = "error";
        out.innerText = "❌ সমস্যা: " + err.message;
    }
}
</script>

</body>
</html>
