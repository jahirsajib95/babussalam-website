<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পরীক্ষার ফলাফল | জামিয়া বাবুস সালাম</title>
    <meta name="description" content="জামিয়ার সাময়িক, বার্ষিক ও মাসিক পরীক্ষার ফলাফল দেখুন ও ডাউনলোড করুন।">
    <meta property="og:type" content="website">
    <meta property="og:title" content="পরীক্ষার ফলাফল | জামিয়া বাবুস সালাম">
    <meta property="og:description" content="জামিয়ার সাময়িক, বার্ষিক ও মাসিক পরীক্ষার ফলাফল দেখুন ও ডাউনলোড করুন।">
    <meta property="og:image" content="https://jamiababussalam.com/images/banner.jpg">
    <meta property="og:url" content="https://jamiababussalam.com/result/result.html">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://jamiababussalam.com/result/result.html">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="result.css">
    <link rel="icon" type="image/png" href="../images/logo.png">
    <link rel="apple-touch-icon" href="../images/logo.png">
    <meta name="theme-color" content="#0F5132">
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="page-header">
        <h1>পরীক্ষার ফলাফল</h1>
        <div class="breadcrumb">
            <a href="../index.html">মূলপাতা</a> / <span>ফলাফল</span>
        </div>
    </section>

    <main class="page-content">
        <div style="text-align: center; max-width: 750px; margin: 0 auto 30px auto;">
            <p>জামিয়া বাবুস সালাম-এর বিভিন্ন পরীক্ষার ফলাফল নিচে দেওয়া হলো। আপনার কাঙ্ক্ষিত পরীক্ষার ট্যাবে ক্লিক করে ফলাফল দেখুন ও ডাউনলোড করুন।</p>
        </div>

        <!-- ফিল্টার ট্যাব -->
        <div class="result-tabs-wrapper">
            <div class="result-tabs">
                <button class="tab-btn active" onclick="filterTab('term1', this)">১. প্রথম সাময়িক</button>
                <button class="tab-btn" onclick="filterTab('term2', this)">২. দ্বিতীয় সাময়িক</button>
                <button class="tab-btn" onclick="filterTab('annual', this)">৩. বার্ষিক পরীক্ষা</button>
                <button class="tab-btn" onclick="filterTab('monthly', this)">৪. মাসিক পরীক্ষা</button>
            </div>
        </div>

        <!-- ফলাফল কন্টেইনার -->
        <div class="result-list" id="resultContainer">
            <div id="loading" style="text-align:center; padding:30px;">ফলাফল লোড হচ্ছে...</div>
            <div id="noResultMsg" class="empty-message">
                <p>⚠️ এই ক্যাটাগরিতে এখনো কোনো ফলাফল প্রকাশিত হয়নি।</p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../main.js" defer></script>

    <!-- data.json থেকে লোড ও ফিল্টারিং স্ক্রিপ্ট -->
    <script>
        let currentCategory = 'term1';

        function renderResults(results) {
            const container = document.getElementById('resultContainer');
            const noMsg = document.getElementById('noResultMsg');
            container.querySelectorAll('.result-card').forEach(c => c.remove());

            let hasCard = false;

            results.forEach(r => {
                const cardCat = r.category || 'annual';
                const card = document.createElement('div');
                card.className = 'result-card';
                card.setAttribute('data-category', cardCat);
                if (cardCat !== currentCategory) card.style.display = 'none';
                else hasCard = true;

                card.innerHTML = `
                    <div class="result-info">
                        <span class="folder-icon">📁</span>
                        <div class="result-details">
                            <h4>${r.exam}</h4>
                            <div class="result-meta">
                                <span>📅 প্রকাশের সময়: ${r.publishTime || 'নির্দিষ্ট নয়'}</span>
                                <span>🏷️ বিভাগ: ${r.className}</span>
                            </div>
                        </div>
                    </div>
                    <a href="${r.url}" target="_blank" class="btn btn-primary">ফলাফল দেখুন ও ডাউনলোড</a>
                `;
                container.appendChild(card);
            });

            noMsg.style.display = hasCard ? 'none' : 'block';
        }

        function filterTab(category, buttonElement) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            const cards = document.querySelectorAll('.result-card');
            let hasCard = false;
            cards.forEach(card => {
                if(card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                    hasCard = true;
                } else {
                    card.style.display = 'none';
                }
            });
            document.getElementById('noResultMsg').style.display = hasCard ? 'none' : 'block';
        }

        // data.json ফেচ করা (রুট ডিরেক্টরি থেকে)
        fetch('../data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if(data.results) {
                    renderResults(data.results);
                }
            })
            .catch(() => {
                document.getElementById('loading').innerText = 'ফলাফল লোড করা সম্ভব হয়নি।';
            });
    </script>
</body>
</html>
